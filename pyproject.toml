[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "searchless_chess"
version = "0.1.0"
description = "Grandmaster-Level Chess Without Search (DeepMind)"
requires-python = ">=3.10"
dependencies = [
    "absl-py",
    "chess",
    "chex",
    "dm-haiku",
    "jax",
    "jaxtyping",
    "numpy",
    "optax",
    "orbax-checkpoint",
    "scipy",
    "typing-extensions",
]

[tool.setuptools]
packages = [
    "searchless_chess",
    "searchless_chess.src",
    "searchless_chess.src.engines",
]
package-dir = {"searchless_chess" = "."}
